; M5StickS3 (K150) - IR Copy remote
; Uses the pioarduino platform fork to get Arduino core 3.x (ESP-IDF 5),
; which is required for the new RMT driver (driver/rmt_tx.h / rmt_rx.h)
; that the StickS3 IR hardware needs.

[env:m5sticks3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
; No official StickS3 board definition exists yet -> generic ESP32-S3 board.
; StickS3 uses ESP32-S3-PICO-1-N8R8 (8MB flash).
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    m5stack/M5Unified@^0.2.12

monitor_speed = 115200
